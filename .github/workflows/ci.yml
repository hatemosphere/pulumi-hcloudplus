name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & lint
    runs-on: ubuntu-latest
    env:
      # tfgen and pulumi plugin downloads hit api.github.com under the
      # hood; without an authenticated token they land on the 60 req/hr
      # anonymous rate limit and fail intermittently. Granting the
      # built-in workflow token gets us 5000 req/hr.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.27"

      - name: Install Pulumi CLI
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6.6.1
        with:
          # Pinned: SDK codegen output changes between CLI releases and CI
          # checks sdk/nodejs for drift.
          pulumi-version: 3.267.0

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-only: true

      - name: Install Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"

      - name: go mod download
        working-directory: provider
        run: go mod download

      - name: Build tfgen + provider binaries
        run: make provider

      - name: Lint Go code
        run: make lint

      - name: Regenerate schema and check for drift
        run: |
          make schema
          if ! git diff --exit-code provider/cmd/pulumi-resource-hcloudplus/schema.json provider/cmd/pulumi-resource-hcloudplus/bridge-metadata.json; then
            echo "::error::schema.json or bridge-metadata.json is out of date — run 'make schema' and commit the result"
            exit 1
          fi

      - name: Regenerate nodejs SDK and check for drift
        run: |
          make build_nodejs
          if ! git diff --exit-code sdk/nodejs; then
            echo "::error::sdk/nodejs is out of date — run 'make build_nodejs' and commit the result"
            exit 1
          fi
