name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build + publish
    runs-on: ubuntu-latest
    env:
      # Same reason as ci.yml — tfgen pulls pulumi plugins from the
      # GitHub API on every run; unauthenticated calls hit the 60 req/hr
      # rate limit and fail "make schema". The built-in workflow token
      # is enough to raise the limit to 5000 req/hr.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.27"

      - name: Install Pulumi CLI
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6.6.1
        with:
          # Pinned: SDK codegen output changes between CLI releases and CI
          # checks sdk/nodejs for drift.
          pulumi-version: 3.267.0

      - name: Install Node.js (wired to GitHub Packages for @hatemosphere scope)
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@hatemosphere"

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build provider (embeds real version via ldflags)
        run: VERSION=${{ steps.version.outputs.version }} make provider

      - name: Regenerate schema
        run: VERSION=${{ steps.version.outputs.version }} make schema

      - name: Regenerate Node.js SDK
        run: make build_nodejs

      - name: Build Node.js SDK tarball
        working-directory: sdk/nodejs
        run: |
          npm install
          npm run build

      - name: Publish Node.js SDK to GitHub Packages
        working-directory: sdk/nodejs/bin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish

      # Provider plugin binary for Pulumi to download via pluginDownloadURL.
      # Pulumi expects a tarball named
      # pulumi-resource-<name>-v<version>-<os>-<arch>.tar.gz at the release
      # URL the schema advertises.
      - name: Build cross-platform provider binaries
        run: |
          VERSION=${{ steps.version.outputs.version }}
          BIN="$PWD/bin-dist"
          mkdir -p "$BIN"
          for os_arch in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64; do
            os=${os_arch%-*}
            arch=${os_arch#*-}
            ext=""
            [ "$os" = "windows" ] && ext=".exe"
            out="$BIN/pulumi-resource-hcloudplus$ext"
            cd provider
            GOOS=$os GOARCH=$arch go build \
              -o "$out" \
              -ldflags "-X github.com/hatemosphere/pulumi-hcloudplus/provider/pkg/version.Version=$VERSION" \
              ./cmd/pulumi-resource-hcloudplus
            cd ..
            tar -C "$BIN" -czf "$BIN/pulumi-resource-hcloudplus-v$VERSION-$os-$arch.tar.gz" "pulumi-resource-hcloudplus$ext"
            rm "$out"
          done

      - name: Attach binaries to GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          files: bin-dist/pulumi-resource-hcloudplus-v*.tar.gz
          generate_release_notes: true
