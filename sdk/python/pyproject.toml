[project]
  name = "hatemosphere_pulumi_hcloudplus"
  description = "A Pulumi provider for Hetzner Cloud's undocumented console API. Manages projects, mints project API tokens, invites members, and reads cross-project audit logs — everything the official hcloud Pulumi/Terraform provider can't reach. Built on terraform-provider-hcloudplus."
  dependencies = ["packaging>=24.0", "pulumi>=3.231.0,<4.0.0", "semver>=2.8.1", "typing-extensions>=4.11,<5; python_version < \"3.11\""]
  keywords = ["pulumi", "hcloud", "hetzner", "hetzner-cloud", "category/cloud", "kind/native"]
  readme = "README.md"
  requires-python = ">=3.9"
  version = "0.0.0"
  [project.license]
    text = "Apache-2.0"
  [project.urls]
    Homepage = "https://github.com/hatemosphere/pulumi-hcloudplus"
    Repository = "https://github.com/hatemosphere/pulumi-hcloudplus"

[build-system]
  requires = ["setuptools>=61.0"]
  build-backend = "setuptools.build_meta"

[tool]
  [tool.setuptools]
    [tool.setuptools.package-data]
      hatemosphere_pulumi_hcloudplus = ["py.typed", "pulumi-plugin.json"]
